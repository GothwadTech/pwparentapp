# ---------------------------------------------------------------------------
# TEMPLATE CONFIGURATION  --  rebrand the app from this block
# ---------------------------------------------------------------------------
# The current values target the PW Parent App (com.pw.parent). Change them
# before shipping a different app; nothing else in the project hardcodes the branding.
#
# The web target URL lives in .env / .env.example (TARGET_URL), following the
# existing web-deploy convention. The trusted origin for camera / microphone /
# geolocation is derived from that URL, so it follows along automatically.
#
# app.* values are read by app/build.gradle.kts and surfaced to the code as
# BuildConfig fields plus the launcher label (res/values/strings.xml app_name).
app.name=Parent App
app.id=com.pw.parent
# CI overrides these with -PversionCode / -PversionName on release builds.
app.versionCode=1
app.versionName=1.0.0
# Name of the injected JavaScript bridge: the web app calls window.<name>.*
app.jsBridgeName=ParentApp
# Android notification channel
app.notificationChannelId=pw_parent_notifications
app.notificationChannelName=Parent App Notifications
app.notificationChannelDescription=Updates and important alerts for your child from the app
# SharedPreferences file used to cache the FCM registration token
app.prefsName=parent_app_prefs

# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Set the maximum number of workers to 4 to avoid overloading the machine.
org.gradle.workers.max=4
# Set the Kotlin compiler execution strategy to in-process to avoid "Could not
# connect to Kotlin compile daemon" error.
kotlin.compiler.execution.strategy=in-process
